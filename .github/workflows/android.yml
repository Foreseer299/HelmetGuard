name: Android CI

on:
  push:
    branches: [main, release/2.1]
  pull_request:
    branches: [main, "arena/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and debug APK
        shell: bash
        run: |
          set +e
          ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace 2>&1 | tee gradle-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo '### Gradle failure (last 240 lines)'
              echo '```text'
              tail -n 240 gradle-output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            branch_name=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
            pr_number=$(gh pr list --head "$branch_name" --state open --json number --jq '.[0].number // empty')
            if [ -n "$pr_number" ]; then
              {
                echo '### Android CI compile failure'
                echo '<details><summary>Last 180 Gradle lines</summary>'
                echo
                echo '```text'
                grep -ni -E '(^e: | error: |FAILURE:|What went wrong|FAILED|failed|Assertion|expected|lint found)' gradle-output.log | tail -n 240
                if [ -f app/build/reports/lint-results-debug.txt ]; then
                  echo
                  echo '--- lint errors ---'
                  grep -n -B 1 -A 3 ' Error:' app/build/reports/lint-results-debug.txt || true
                fi
                echo
                echo '--- tail ---'
                tail -n 80 gradle-output.log
                echo '```'
                echo '</details>'
              } > /tmp/gradle-comment.md
              gh pr comment "$pr_number" --body-file /tmp/gradle-comment.md
            fi
          fi
          exit "$status"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helmetguard-reports
          path: |
            app/build/reports/
            app/build/test-results/
            gradle-output.log
          if-no-files-found: ignore
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: helmetguard-debug
          path: app/build/outputs/apk/debug/*.apk

  incident-regression:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: incident-regression
            disable-animations: true
            animation-scale: '0'
            font-scale: '1.0'
            display-density: ''
            test-class: ''
            artifact: helmetguard-incident-regression
          - suite: motion-regression
            disable-animations: false
            animation-scale: '1'
            font-scale: '1.0'
            display-density: ''
            test-class: com.helmet.guard.UiMotionTest
            artifact: helmetguard-motion-regression
          - suite: accessibility-regression
            disable-animations: true
            animation-scale: '0'
            font-scale: '1.6'
            display-density: '540'
            test-class: com.helmet.guard.UiAccessibilityTest
            artifact: helmetguard-accessibility-regression
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Accident screen and incident lifecycle regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: ${{ matrix.disable-animations }}
          script: bash scripts/android-regression.sh
        env:
          UI_TEST_CLASS: ${{ matrix.test-class }}
          UI_MOTION_SCALE: ${{ matrix.animation-scale }}
          UI_FONT_SCALE: ${{ matrix.font-scale }}
          UI_DISPLAY_DENSITY: ${{ matrix.display-density }}
      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            ui-previews/
